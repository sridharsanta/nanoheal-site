<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Nanoheal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
:root{--bone:#EFEDEB;--tx:#1A1716;--tx-2:#57534F;--line:#D8D4D1;--paper:#fff;--teal:#04737E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bone:#141110;--tx:#EFEDEB;--tx-2:#B0A9A4;--line:#302B29;--paper:#211D1C;--teal:#4FB3BC}}
:root[data-theme="dark"]{--bone:#141110;--tx:#EFEDEB;--tx-2:#B0A9A4;--line:#302B29;--paper:#211D1C;--teal:#4FB3BC}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--tx);font-family:Inter,system-ui,sans-serif;
 min-height:100vh;display:grid;place-items:center;padding:32px;line-height:1.6}
.b{max-width:52ch}
h1{font-family:"Instrument Sans",Inter,sans-serif;font-weight:500;letter-spacing:-.025em;
 font-size:clamp(30px,5vw,46px);line-height:1.1;margin:0 0 16px}
p{margin:0;color:var(--tx-2);font-size:15px}
.k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-2);margin-bottom:18px}
a.btn{display:inline-flex;margin-top:28px;padding:9px 15px;border:1px solid var(--line);
 border-radius:4px;background:var(--paper);color:var(--tx);text-decoration:none;font-size:13.5px;font-weight:500}
a.btn:hover{border-color:var(--teal);color:var(--teal)}
</style>
</head>
<body>
  <div class="b">
    <p class="k">Error 404</p>
    <h1>This one we couldn't autoheal.</h1>
    <p>The page you asked for isn't here. Everything else is one click away.</p>
    <a class="btn" href="/">Back to nanoheal.com</a>
  </div>
</body>
</html>
